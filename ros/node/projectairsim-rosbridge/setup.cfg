[develop]
script_dir=$base/lib/projectairsim_rosbridge

[install]
install_scripts=$base/lib/projectairsim_rosbridge

# Without this section colcon falls back to "setup.py test", which is
# unittest-based and silently collects none of the pytest-style tests below,
# so "colcon test" reports success having run nothing.
[tool:pytest]
testpaths = test
